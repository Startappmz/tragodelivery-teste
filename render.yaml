services:
  - type: web
    name: trago-delivery-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TRAGO_ORS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESET_EMAIL_FROM
        sync: false
      - key: RESET_EMAIL_REPLY_TO
        sync: false
